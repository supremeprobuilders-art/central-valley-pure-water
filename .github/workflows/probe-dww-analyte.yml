name: Probe California Drinking Water Watch analyte flow

on:
  push:
    branches:
      - research/dww-analyte-probe
    paths:
      - .github/workflows/probe-dww-analyte.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dww-analyte-probe
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --quiet requests beautifulsoup4

      - name: Fetch and inspect official DWW pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/dww-probe
          python - <<'PY'
          from __future__ import annotations
          import json
          import pathlib
          import re
          import urllib.parse
          import requests
          from bs4 import BeautifulSoup

          out = pathlib.Path('research/dww-probe')
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Central Valley Pure Water data integration research/1.0 (+https://www.cvpurewater.com)'
          })

          urls = {
              'wrapper': 'https://sdwis.waterboards.ca.gov/PDWW/JSP/NMonitoringResultsByAnalyte.jsp?begin_date=&end_date=&tinwsys_is_number=5556&tinwsys_st_code=CA',
              'form': 'https://sdwis.waterboards.ca.gov/PDWW/JSP/NMonitoringResultsByAnalyteForm.jsp?SamplingPointID=&SamplingPointName=&SystemName=MODESTO%2C+CITY+OF&begin_date=&end_date=&tinwsys_is_number=5556&tinwsys_st_code=CA&ws_number=5010010',
              'system': 'https://sdwis.waterboards.ca.gov/PDWW/JSP/WaterSystemDetail.jsp?counter=0&tinwsys_is_number=5556&tinwsys_st_code=CA',
          }
          summary = {'pages': {}, 'forms': [], 'scripts': [], 'links': []}

          for name, url in urls.items():
              r = session.get(url, timeout=45)
              r.raise_for_status()
              (out / f'{name}.html').write_text(r.text, encoding='utf-8')
              soup = BeautifulSoup(r.text, 'html.parser')
              summary['pages'][name] = {
                  'url': r.url,
                  'status': r.status_code,
                  'length': len(r.text),
                  'title': soup.title.get_text(' ', strip=True) if soup.title else None,
              }
              for form in soup.find_all('form'):
                  fields = []
                  for element in form.find_all(['input', 'select', 'textarea', 'button']):
                      item = {
                          'tag': element.name,
                          'name': element.get('name'),
                          'id': element.get('id'),
                          'type': element.get('type'),
                          'value': element.get('value'),
                          'text': element.get_text(' ', strip=True)[:200],
                      }
                      if element.name == 'select':
                          item['options'] = [
                              {'value': o.get('value'), 'text': o.get_text(' ', strip=True)}
                              for o in element.find_all('option')[:100]
                          ]
                      fields.append(item)
                  summary['forms'].append({
                      'page': name,
                      'action': urllib.parse.urljoin(r.url, form.get('action') or ''),
                      'method': (form.get('method') or 'get').lower(),
                      'id': form.get('id'),
                      'name': form.get('name'),
                      'fields': fields,
                  })
              for script in soup.find_all('script', src=True):
                  script_url = urllib.parse.urljoin(r.url, script['src'])
                  if script_url not in summary['scripts']:
                      summary['scripts'].append(script_url)
              for a in soup.find_all('a', href=True):
                  href = urllib.parse.urljoin(r.url, a['href'])
                  text = a.get_text(' ', strip=True)
                  if 'Monitoring' in text or 'Analyte' in text or 'Result' in text or 'Excel' in text:
                      summary['links'].append({'page': name, 'text': text, 'href': href})

          # Download JavaScript that may define autocomplete/result endpoints.
          for i, script_url in enumerate(summary['scripts']):
              try:
                  r = session.get(script_url, timeout=30)
                  if r.ok and len(r.text) < 2_000_000:
                      (out / f'script-{i:02d}.js').write_text(r.text, encoding='utf-8')
              except Exception as exc:
                  (out / f'script-{i:02d}.error.txt').write_text(repr(exc), encoding='utf-8')

          # Collect URL-like JSP references from downloaded HTML/JS.
          endpoint_hits = set()
          for path in out.iterdir():
              if path.suffix not in {'.html', '.js'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for hit in re.findall(r"[A-Za-z0-9_./-]+\.jsp(?:\?[^\"'<>\s]*)?", text):
                  endpoint_hits.add(hit)
          summary['jsp_references'] = sorted(endpoint_hits)

          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Commit probe output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/dww-probe
          git diff --cached --check
          git commit -m 'Record Drinking Water Watch analyte probe'
          git push origin HEAD:research/dww-analyte-probe
